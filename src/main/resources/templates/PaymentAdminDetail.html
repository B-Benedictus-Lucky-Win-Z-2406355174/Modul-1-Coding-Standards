<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-2">
    <h3>Payment Admin Detail</h3>
    <table border="1" class="table table-striped col-6">
        <tr>
            <th>Payment ID</th>
            <td th:text="${payment.id}"></td>
        </tr>
        <tr>
            <th>Method</th>
            <td th:text="${payment.method}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${payment.status}"></td>
        </tr>
    </table>

    <div class="mt-3">
        <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" style="display:inline;">
            <input type="hidden" name="status" value="SUCCESS"/>
            <button type="submit" class="btn btn-success btn-sm">Accept</button>
        </form>
        <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" style="display:inline;">
            <input type="hidden" name="status" value="REJECTED"/>
            <button type="submit" class="btn btn-danger btn-sm">Reject</button>
        </form>
    </div>

    <a th:href="@{/payment/admin/list}" class="btn btn-secondary btn-sm mt-3">Back to Payment List</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
