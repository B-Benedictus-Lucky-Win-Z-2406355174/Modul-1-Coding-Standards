<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin List</title>
</head>
<body>
<div class="container">
    <h3>All Payments</h3>
    <table class="table">
        <thead>
            <tr>
                <th>Payment ID</th>
                <th>Method</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.id}"></td>
                <td th:text="${payment.method}"></td>
                <td th:text="${payment.status}"></td>
                <td><a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}">Detail</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
