<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-2">
    <h3>Payment Detail</h3>
    <form id="paymentDetailForm" class="mb-3">
        <div class="form-group">
            <label for="paymentIdInput">Payment ID</label>
            <input type="text" class="form-control mb-4 col-4" id="paymentIdInput" placeholder="Enter payment ID">
        </div>
        <button type="button" class="btn btn-primary" onclick="goToDetail()">Search</button>
    </form>
</div>

<script>
    function goToDetail() {
        var paymentId = document.getElementById('paymentIdInput').value;
        if (paymentId) {
            window.location.href = '/payment/detail/' + paymentId;
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
